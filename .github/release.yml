# Configures the auto-generated release notes produced by
# `generate_release_notes: true` in .github/workflows/build-release.yml
changelog:
  exclude:
    authors:
      - dependabot
  categories:
    # One label per category, each of which exists in the repo.
    # Contributor-facing table: CONTRIBUTING.md
    - title: Breaking Changes
      labels:
        - breaking-change
    - title: Features
      labels:
        - enhancement
    - title: Bug Fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Dependencies
      labels:
        - dependencies
    - title: Other Changes
      labels:
        - "*"
